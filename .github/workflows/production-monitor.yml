name: Production metadata monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy (ashbi)']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  monitor:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate metadata monitor failure paths
        run: python3 scripts/ops/test_monitor.py
      - name: Resolve last successfully deployed revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          get() { curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Cache-Control: no-cache' "$1"; }
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          run_id="$SOURCE_RUN_ID"
          if [[ -z "$run_id" ]]; then
            # Scheduled/manual checks resolve a completed successful deployment.
            # The triggering run ID avoids workflow-list indexing lag after deploy.
            run_id=$(get "$api/actions/workflows/deploy-ashbi.yml/runs?status=completed&per_page=100" | jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '::error::No successful deployment'; exit 1; }
          artifact=""
          for attempt in $(seq 1 10); do
            if get "$api/actions/runs/$run_id" | jq -e '.conclusion == "success" and .path == ".github/workflows/deploy-ashbi.yml"' >/dev/null; then
              artifact=$(get "$api/actions/runs/$run_id/artifacts" | jq -r '[.artifacts[] | select(.name == "production-deployment" and .expired == false)][0].id // empty')
              [[ "$artifact" =~ ^[0-9]+$ ]] && break
            fi
            sleep 2
          done
          [[ "$artifact" =~ ^[0-9]+$ ]] || { echo '::error::Deployment record missing/expired'; exit 1; }
          get "$api/actions/artifacts/$artifact/zip" > deployment.zip
          unzip -p deployment.zip publication.json > deployment.json
          revision=$(jq -r .revision deployment.json)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::No successful deployment record'; exit 1; }
          printf 'EXPECTED_REVISION=%s\n' "$revision" >> "$GITHUB_ENV"
      - name: Check public HTTPS, TLS expiry, app/PWA and revision
        run: python3 scripts/ops/monitor.py --revision "$EXPECTED_REVISION"
