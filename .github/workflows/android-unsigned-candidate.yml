name: Android unsigned candidate

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Android versionCode from android/app/build.gradle'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-unsigned-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: Unsigned Android release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION_CODE_INPUT: ${{ inputs.versionCode }}
      ANDROID_UNSIGNED_RELEASE: 'true'
    steps:
      - name: Validate version input
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_CODE_INPUT" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo '::error::versionCode must be a positive integer of at most 9 digits'
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify source identity
        id: identity
        run: |
          set -euo pipefail
          source_code="$(awk -F"'" '/versionCode Integer.parseInt/{print $4}' android/app/build.gradle)"
          source_version="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' android/app/build.gradle | head -n 1)"
          package_name="$(sed -n 's/^[[:space:]]*applicationId "\([^"]*\)"/\1/p' android/app/build.gradle | head -n 1)"
          [[ -n "$source_code" && -n "$source_version" && -n "$package_name" ]] || {
            echo '::error::Could not read Android package/version identity from build.gradle'
            exit 1
          }
          [[ "$source_code" == "$VERSION_CODE_INPUT" ]] || {
            echo "::error::Dispatch versionCode $VERSION_CODE_INPUT does not match source default $source_code"
            exit 1
          }
          {
            echo "source_revision=$(git rev-parse HEAD)"
            echo "package=$package_name"
            echo "version_name=$source_version"
            echo "version_code=$source_code"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: Build unsigned release bundle
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Write candidate provenance
        env:
          SOURCE_REVISION: ${{ steps.identity.outputs.source_revision }}
          PACKAGE_NAME: ${{ steps.identity.outputs.package }}
          VERSION_NAME: ${{ steps.identity.outputs.version_name }}
          VERSION_CODE: ${{ steps.identity.outputs.version_code }}
        run: |
          set -euo pipefail
          aab_path="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          [[ -n "$aab_path" ]] || { echo '::error::Unsigned AAB was not produced'; exit 1; }
          artifact_name="$(basename "$aab_path")"
          artifact_sha256="$(sha256sum "$aab_path" | awk '{print $1}')"
          artifact_bytes="$(wc -c < "$aab_path" | tr -d '[:space:]')"
          cat > android-candidate-provenance.json <<EOF
          {
            "artifact": "$artifact_name",
            "artifact_sha256": "$artifact_sha256",
            "artifact_bytes": $artifact_bytes,
            "package": "$PACKAGE_NAME",
            "version_name": "$VERSION_NAME",
            "version_code": $VERSION_CODE,
            "source_revision": "$SOURCE_REVISION",
            "signing": "unsigned; sign externally with the approved upload key",
            "build_workflow": "android-unsigned-candidate.yml"
          }
          EOF
          cat android-candidate-provenance.json >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faithful-days-android-unsigned-candidate-${{ inputs.versionCode }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android-candidate-provenance.json
          if-no-files-found: error
          retention-days: 7
