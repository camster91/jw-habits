# Deploy a tested publication by digest, stage before cutover, retain rollback state.
name: Deploy (ashbi)

on:
  workflow_run:
    workflows: ['Build and Push Image']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA on main to deploy (default: latest main)'
        required: false
        type: string

concurrency:
  group: production-deploy-ashbi
  cancel-in-progress: false

permissions:
  contents: read
  packages: read
  actions: read

env:
  PROJECT_NAME: jw-habits
  PROJECT_DIR: /opt/projects/jw-habits
  PORT: '18080'
  PUBLIC_URL: https://jwhabits.ashbi.ca
  IMAGE_REPO: ghcr.io/camster91/jw-habits

jobs:
  deploy:
    name: Deploy jw-habits (ashbi)
    # Only deploy builds that came from a push to main and succeeded.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve verified publication
        id: image
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          sha="${INPUT_SHA:-${RUN_SHA:-$GITHUB_SHA}}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::A full commit SHA is required'; exit 1; }
          get() { curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$1"; }
          run_id="$RUN_ID"
          if [[ -z "$run_id" ]]; then
            run_id=$(get "$api/actions/workflows/build-and-push.yml/runs?branch=main&event=push&status=success&per_page=100" | jq -r --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha)][0].id // empty')
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo '::error::No successful publication run exists for this SHA'; exit 1; }
          get "$api/actions/runs/$run_id" | jq -e --arg sha "$sha" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .event == "push"' >/dev/null
          artifact=$(get "$api/actions/runs/$run_id/artifacts" | jq -r '[.artifacts[] | select(.name == "production-image" and .expired == false)][0].id // empty')
          [[ "$artifact" =~ ^[0-9]+$ ]] || { echo '::error::Missing immutable publication record; refusing tag fallback'; exit 1; }
          get "$api/actions/artifacts/$artifact/zip" > publication.zip
          unzip -p publication.zip production-image.json > publication.json
          ref=$(jq -r --arg sha "$sha" 'select(.revision == $sha) | .image' publication.json)
          [[ "$ref" =~ ^ghcr.io/camster91/jw-habits@sha256:[0-9a-f]{64}$ ]] || { echo '::error::Invalid publication record'; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            current=$(get "$api/branches/main" | jq -r .commit.sha)
            [[ "$sha" == "$current" ]] || { echo '::error::Superseded main build; refusing to deploy stale revision'; exit 1; }
          fi
          printf 'ref=%s\nrevision=%s\n' "$ref" "$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying verified publication $ref at $sha"

      - name: Setup SSH
        uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add host to known_hosts
        # Host keys for 187.77.26.99, copied from camster91/ashbi-deploy
        # (originally from `ssh-keyscan -H 187.77.26.99`).
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' \
            '187.77.26.99 ssh-rsa ' \
            '187.77.26.99 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBJlCcQfxZM13+CjrEnMZhgwyjVk36K342Yzhv/E3xm7GUNthegor0435SNre1t1W9GGYsHpSyEwQ7ceShAmBgC0=' \
            '187.77.26.99 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIS3KjJjSOq0gDvXghVLH8mxDqcwQi1DoAKWyRAbZvwt' \
            >> ~/.ssh/known_hosts

      - name: 'Pre-deploy: clear fail2ban self-ban'
        # fail2ban on the VPS sometimes bans the runner after repeated
        # SSH attempts. Best effort; never fails the job.
        continue-on-error: true
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          MY_IP=$(curl -sS --max-time 10 https://api.ipify.org || echo "")
          if ! echo "$MY_IP" | grep -qE '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "No usable runner IP; skipping fail2ban check"
            exit 0
          fi
          for i in 1 2 3; do
            timeout --kill-after=5s 15s ssh -o ConnectTimeout=10 -o BatchMode=yes "$USER@$HOST" \
              "fail2ban-client set sshd unbanip \"$MY_IP\"" 2>/dev/null && break
            sleep 5
          done || true

      - name: Stage, deploy and validate (automatic rollback)
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          IMAGE: ${{ steps.image.outputs.ref }}
          REVISION: ${{ steps.image.outputs.revision }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          script_b64=$(base64 -w0 scripts/deploy/remote.sh)
          rollback_b64=$(base64 -w0 scripts/deploy/rollback.sh)
          printf '%s\n' "$GHCR_TOKEN" | ssh -o ConnectTimeout=10 "$USER@$HOST" \
            "export PROJECT_DIR='$PROJECT_DIR' PROJECT_NAME='$PROJECT_NAME' PORT='$PORT' GHCR_USER='$GHCR_USER' IMAGE='$IMAGE' REVISION='$REVISION' PUBLIC_URL='$PUBLIC_URL'
             f=\$(mktemp); printf %s '$script_b64' | base64 -d > \"\$f\"
             bash \"\$f\"; rc=\$?; rm -f \"\$f\"
             if [ \"\$rc\" = 0 ]; then printf %s '$rollback_b64' | base64 -d > '$PROJECT_DIR/.release/rollback.sh'; fi
             exit \$rc"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deployment
          path: publication.json
          retention-days: 90

      - name: Summary
        if: always()
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "## Deploy $PROJECT_NAME"
            echo "- **Image:** \`$IMAGE\`"
            echo "- **Public URL:** $PUBLIC_URL/"
            echo "- **Result:** $STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
