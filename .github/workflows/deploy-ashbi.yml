# jw-habits — VPS deploy via camster91/ashbi-deploy reusable
#
# Pull-only compose: image is prebuilt by build-and-push.yml and pushed
# to ghcr.io. The reusable's SSH + pull + up flow handles the rest.
name: Deploy (ashbi)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-ashbi
  cancel-in-progress: false

jobs:
  deploy-ashbi:
    name: Deploy jw-habits (ashbi)
    permissions: {}
    uses: camster91/ashbi-deploy/.github/workflows/deploy.yml@8038ff977ab8b1d19d810a441e0a5987bf1eb413
    with:
      project_name: jw-habits
      port: "18080"
      public_url: https://jwhabits.ashbi.ca
      compose_b64: 
      env_b64: 
    secrets:
      vps_ssh_key: ${{ secrets.VPS_SSH_KEY }}
      vps_host:    ${{ secrets.VPS_HOST }}
      vps_user:    ${{ secrets.VPS_USER }}
