# jw-habits — VPS deploy via camster91/ashbi-deploy reusable
#
# Thin caller for the reusable workflow. Replaces the existing
# .github/workflows/deploy.yml (Coolify trigger) and
# .github/workflows/deploy-coolify.yml (full Coolify deploy).
#
# After dispatch is verified end-to-end, delete both old files.
# Caddy vhost for jwhabits.ashbi.ca is already declared in
# /opt/caddy/Caddyfile on the host.
#
# The compose is pull-only: image is prebuilt by
# .github/workflows/build-and-push.yml and pushed to
# ghcr.io/camster91/jw-habits. The reusable's
# `docker compose build --no-cache` is a no-op (no `build:` block).
#
# File name is `deploy-ashbi.yml` (not `deploy.yml`) so it
# doesn't collide with the existing Coolify deploy.yml while
# both workflows exist. Rename to deploy.yml + delete the
# Coolify files once the new path is verified.

name: Deploy (ashbi)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy-ashbi
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy jw-habits (ashbi)
    uses: camster91/ashbi-deploy/.github/workflows/deploy.yml@main
    with:
      project_name: jw-habits
      port: "18080"
      public_url: https://jwhabits.ashbi.ca
      compose_b64: 
      env_b64: 
    secrets:
      vps_ssh_key: ${{ secrets.VPS_SSH_KEY || secrets.COOLIFY_SSH_KEY }}
      vps_host:    ${{ secrets.VPS_HOST    || secrets.COOLIFY_HOST }}
      vps_user:    ${{ secrets.VPS_USER    || secrets.COOLIFY_USER }}
