name: Android closed testing
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Unused build number allocated from Play history (default: native-release.json)'
        required: false
        type: string
      upload:
        description: 'Request separately approved upload to configured closed track'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: android-closed-testing
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high && npm run lint && npm run test:coverage && npm run format:check && npm run build && npm run budgets
      - run: python3 scripts/native/test_release_guard.py && python3 scripts/native/test_release_evidence.py && python3 scripts/native/test_keystore_generator.py
      - name: Require exact-source web and native checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py source
  bundle:
    needs: preflight
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BUILD_INPUT: ${{ inputs.build_number }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require solo-owner environment approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/native/release_guard.py environment --environment android-signing
      - name: Require approved upload certificate fingerprint before reading key material
        run: |
          python3 - <<'PY'
          import os
          from scripts.native.release_evidence import normalize_certificate_sha256
          try:
              normalize_certificate_sha256(os.environ.get('ANDROID_UPLOAD_CERT_SHA256', ''))
          except ValueError:
              raise SystemExit('Configure the independently approved upload certificate SHA-256')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.1.0'
      - run: npm ci
      - run: python3 scripts/native/release_evidence.py resolve --output native-version.json --github-env "$GITHUB_ENV"
      - run: npm run build && npx cap sync android
      - name: Prepare approved upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          try:
              raw = base64.b64decode(os.environ['ANDROID_UPLOAD_KEYSTORE_BASE64'], validate=True)
              if not raw: raise ValueError()
              Path(os.environ['RUNNER_TEMP'], 'faithful-days-upload.jks').write_bytes(raw)
          except (KeyError, ValueError):
              raise SystemExit('Missing or invalid approved upload keystore')
          PY
      - name: Build signed bundle
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/faithful-days-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Missing signing input: $name"; exit 1; }
          done
          [[ ! -e android/keystore.properties ]] || { echo '::error::Unexpected local signing properties'; exit 1; }
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease --no-daemon
      - name: Validate actual signed bundle and retain checksum
        run: |
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          python3 scripts/native/release_evidence.py record --metadata native-version.json --artifact android/app/build/outputs/bundle/release/app-release.aab --platform android-aab --bundletool "$RUNNER_TEMP/bundletool.jar" --output native-artifact.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faithful-days-approved-aab-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            native-version.json
            native-artifact.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/faithful-days-upload.jks"
  upload:
    needs: bundle
    if: inputs.upload
    environment: play-closed-testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require independent upload approval and closed-track configuration
        env:
          GH_TOKEN: ${{ github.token }}
          CLOSED_TRACK: ${{ vars.PLAY_CLOSED_TRACK }}
        run: |
          set -euo pipefail
          python3 scripts/native/release_guard.py environment --environment play-closed-testing
          [[ "$CLOSED_TRACK" =~ ^[a-zA-Z0-9_-]+$ && "$CLOSED_TRACK" != production && "$CLOSED_TRACK" != internal && "$CLOSED_TRACK" != internalsharing && "$CLOSED_TRACK" != beta ]] || { echo '::error::Configure one verified closed track'; exit 1; }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: faithful-days-approved-aab-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-bundle
      - name: Revalidate approved artifact before upload
        env:
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
        run: |
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          python3 scripts/native/release_evidence.py record --metadata approved-bundle/native-version.json --artifact approved-bundle/android/app/build/outputs/bundle/release/app-release.aab --platform android-aab --bundletool "$RUNNER_TEMP/bundletool.jar" --output upload-native-artifact.json
          cmp approved-bundle/native-artifact.json upload-native-artifact.json
      - name: Upload approved bundle to closed testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ca.ashbi.habittracker
          releaseFiles: approved-bundle/android/app/build/outputs/bundle/release/app-release.aab
          tracks: ${{ vars.PLAY_CLOSED_TRACK }}
          status: completed
          changesNotSentForReview: true
      - name: Record upload boundary
        run: echo 'Upload action completed. Confirm Play edit/review, processing, closed-track availability and physical installation in the release issue.' >> "$GITHUB_STEP_SUMMARY"
