name: Smoke

# Real-build routines, storage, English UI/locale, responsive/a11y and offline gates.
# Chromium owns the worker-update checks and synthetic screenshot references.
# Firefox/WebKit independently run smoke, journeys and accessibility checks.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Smoke script uses SPAWN_PREVIEW=1 to launch vite preview itself.
      # Build first so preview has something to serve.
      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Run smoke
        run: SPAWN_PREVIEW=1 node scripts/verify/smoke.cjs
        env:
          CI: true

      # Journeys drive the real UI (Settings -> saved link -> row -> reload)
      # rather than seeding localStorage directly. Exits non-zero on failure.
      # journeys.cjs expects a server on :4173 (smoke stops its own preview
      # when it finishes), so start one here and wait for it.
      - name: Run journeys
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/verify/journeys.cjs
          node scripts/verify/accessibility.cjs
          node scripts/verify/offline-update.cjs
          node scripts/marketing/screenshot-store-assets.cjs
        env:
          CI: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: current-store-ui
          path: store-screenshots/
          retention-days: 90

  compatibility:
    name: Browser compatibility (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps "$PLAYWRIGHT_BROWSER"
      - run: npm run build
      - run: npm run smoke:spawn
      - name: Run journeys and accessibility in the selected engine
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/verify/journeys.cjs
          node scripts/verify/accessibility.cjs
