name: Smoke

# Automated smoke + journey tests. Runs the Playwright suites at
# scripts/verify/smoke.cjs against the production build served by vite
# preview. Complements ci.yml (lint + unit tests + build + format + gitleaks).
#
# What it covers:
#   S1: Per-day reset
#   S2: Done state persists across reload
#   S3: P0-4 regression — note-only row does NOT count as done
#   S4: Legacy boolean done shape still works
#   S5: New {done, note} shape round-trips
#   S6: First-launch hint hides after first tap
#   S7: Home renders without console errors
#
# Run locally: `npm run smoke:spawn`
#
# Added 2026-07-22 alongside the keystore + Dockerfile + deploy fix PR.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Smoke script uses SPAWN_PREVIEW=1 to launch vite preview itself.
      # Build first so preview has something to serve.
      - name: Build
        run: npm run build
        env:
          CI: true

      - name: Run smoke
        run: SPAWN_PREVIEW=1 node scripts/verify/smoke.cjs
        env:
          CI: true

      # Journeys drive the real UI (Settings -> saved link -> row -> reload)
      # rather than seeding localStorage directly. Exits non-zero on failure.
      # journeys.cjs expects a server on :4173 (smoke stops its own preview
      # when it finishes), so start one here and wait for it.
      - name: Run journeys
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done
          node scripts/verify/journeys.cjs
          node scripts/verify/accessibility.cjs
          node scripts/verify/offline-update.cjs
        env:
          CI: true
