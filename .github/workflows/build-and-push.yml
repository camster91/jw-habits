name: Build and Push Image

# Pull requests receive a read-only, build-only check. Trusted pushes and
# version tags publish the GHCR image used by the existing VPS deployment.
# Reusable calls publish only for main/master or version-tag refs.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_call:
    inputs:
      image_name:
        description: 'Override image name (default: repository name)'
        required: false
        type: string
      dockerfile:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: 'Dockerfile'
      platforms:
        description: 'Build platforms'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'

permissions: {}

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build image (no publish)
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_call' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' && !startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile || 'Dockerfile' }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: false

  verify:
    name: Verify publication source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: bash -n scripts/deploy/remote.sh scripts/deploy/rollback.sh
      - run: python3 scripts/deploy/test_remote.py
      - run: python3 scripts/deploy/test_diagnose_routing.py
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:spawn

  publish:
    outputs:
      image: ${{ steps.meta.outputs.image }}@${{ steps.image.outputs.digest }}
      image_repo: ${{ steps.meta.outputs.image }}
    needs: verify
    name: Build and publish image
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_call' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      checks: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require successful web, security, smoke and native checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          required='["Build + Lint + Test", "Playwright smoke", "Browser compatibility (firefox)", "Browser compatibility (webkit)", "Android debug compile", "iOS simulator compile"]'
          for attempt in $(seq 1 90); do
            curl -fsS --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > checks.json
            jq '[.check_runs | group_by(.name)[] | max_by(.id)]' checks.json > latest-checks.json
            if jq -e --argjson required "$required" 'any(.[]; .name as $name | ($required | index($name)) != null and .status == "completed" and .conclusion != "success")' latest-checks.json >/dev/null; then
              echo '::error::A required source check failed; nothing will be published'
              exit 1
            fi
            if jq -e --argjson required "$required" '. as $checks | all($required[]; . as $name | any($checks[]; .name == $name and .status == "completed" and .conclusion == "success"))' latest-checks.json >/dev/null; then
              echo 'All required source checks succeeded'
              break
            fi
            if (( attempt == 90 )); then echo '::error::Required source checks did not complete'; exit 1; fi
            sleep 10
          done

      - name: Resolve image metadata
        id: meta
        env:
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          image_name="$IMAGE_NAME_INPUT"
          if [[ -z "$image_name" ]]; then
            image_name="$(printf '%s' "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"
          fi
          if [[ ! "$image_name" =~ ^[a-z0-9]+([._/-][a-z0-9]+)*$ ]]; then
            echo "::error::image_name must be a lowercase Docker repository name"
            exit 1
          fi

          case "$GITHUB_REF" in
            refs/tags/v*) image_tag="$(printf '%s' "$GITHUB_REF" | sed 's#^refs/tags/##')" ;;
            refs/heads/main|refs/heads/master) image_tag="main" ;;
            *)
              echo "::error::Publishing is limited to main, master, and v-prefixed tags"
              exit 1
              ;;
          esac
          if [[ ! "$image_tag" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::The ref does not form a valid Docker tag"
            exit 1
          fi

          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          printf 'image=ghcr.io/camster91/%s\n' "$image_name" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$image_tag" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve publish tags
        id: tags
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.sha }}
        run: |
          set -euo pipefail
          tags="$IMAGE:$IMAGE_TAG,$IMAGE:$IMAGE_TAG-$SHORT_SHA,$IMAGE:sha-$GITHUB_SHA"
          case "$GITHUB_REF" in
            refs/heads/main|refs/heads/master|refs/tags/v*) tags="$tags,$IMAGE:latest" ;;
          esac
          printf 'tags=%s\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile || 'Dockerfile' }}
          platforms: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          build-args: APP_REVISION=${{ github.sha }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: true
          sbom: true
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}

      - name: Record immutable publication
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq -n --arg image "$IMAGE@$DIGEST" --arg revision "$GITHUB_SHA" '{image: $image, revision: $revision}' > production-image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-image
          path: production-image.json
          retention-days: 90

      - name: Image summary
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          IMAGE_TAG: ${{ steps.meta.outputs.tag }}
          SHORT_SHA: ${{ steps.meta.outputs.sha }}
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          {
            echo "## Image published"
            echo ""
            echo "**Image:** $IMAGE:$IMAGE_TAG"
            echo "**Pull:** docker pull $IMAGE:$IMAGE_TAG"
            echo "**Platforms:** $PLATFORMS"
            echo "**SHA:** $SHORT_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  recovery-drill:
    name: Verify published container and rollback
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exercise exact digest on an isolated Docker host
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_REPO: ${{ needs.publish.outputs.image_repo }}
          REVISION: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_DIR: /tmp/faithful-days-recovery
          PROJECT_NAME: jw-habits
          PORT: '18080'
          PUBLIC_URL: http://127.0.0.1:18080
        run: bash scripts/deploy/drill.sh
