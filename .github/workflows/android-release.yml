name: Android release
on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: 'Android versionCode override (default: the value in android/app/build.gradle)'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle:
    name: Signed release AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VERSION_CODE_INPUT: ${{ inputs.versionCode }}
    steps:
      - name: Check signing secrets are present
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=''
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_KEYSTORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing="$missing $name"
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Missing repository secrets:$missing. See docs/store-setup-guide.md."
            exit 1
          fi
          if [[ -n "$VERSION_CODE_INPUT" && ! "$VERSION_CODE_INPUT" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo '::error::versionCode must be a positive integer of at most 9 digits'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Decode upload keystore outside the repository
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.keystore"
          printf 'KEYSTORE_FILE=%s\n' "$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
      - name: Build signed release bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$VERSION_CODE_INPUT" ]]; then export VERSION_CODE="$VERSION_CODE_INPUT"; fi
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faithful-days-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Summary
        if: success()
        run: echo 'Signed AAB built and attached to this run. Upload it to Google Play by hand (Internal testing first).' >> "$GITHUB_STEP_SUMMARY"
