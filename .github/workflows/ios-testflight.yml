name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Unused build number (default: committed native-release.json; verify store history)'
        required: false
        type: string
      marketing_version:
        description: 'Version assertion (must match package.json and tag)'
        required: false
        type: string
      skip_upload:
        description: 'Unsigned simulator compile only; no signing or upload'
        required: false
        type: boolean
        default: false
      upload:
        description: 'Request separately approved TestFlight upload after signing'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
env:
  VERSION_INPUT: ${{ inputs.marketing_version }}
  BUILD_INPUT: ${{ inputs.bundle_version }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high && npm run lint && npm run test:coverage && npm run format:check && npm run build && npm run budgets
      - run: python3 scripts/native/test_release_guard.py && python3 scripts/native/test_release_evidence.py && python3 scripts/native/test_keystore_generator.py
      - run: python3 scripts/native/release_evidence.py resolve --output native-version.json
      - name: Require exact-source checks before signing
        if: inputs.skip_upload != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py source
  simulator:
    needs: preflight
    if: inputs.skip_upload == true
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/native/release_evidence.py resolve --output native-version.json --github-env "$GITHUB_ENV"
      - run: npm run build && npx cap sync ios
      - name: Compile app and widget without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
          MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      - run: echo 'Unsigned simulator compile passed; signing, upload and device behavior remain unverified.' >> "$GITHUB_STEP_SUMMARY"
  archive:
    needs: preflight
    if: inputs.skip_upload != true
    environment: ios-signing
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Require solo-owner signing approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py environment --environment ios-signing
      - run: npm ci
      - run: python3 scripts/native/release_evidence.py resolve --output native-version.json --github-env "$GITHUB_ENV"
      - run: npm run build && npx cap sync ios
      - name: Prepare signing authentication
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in ASC_API_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID ASC_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing protected signing input: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_ci.p8"
          python3 - <<'PY'
          import os, plistlib
          with open('ios/App/App/exportOptions.plist', 'wb') as output:
              plistlib.dump({'method': 'app-store-connect', 'signingStyle': 'automatic', 'teamID': os.environ['ASC_TEAM_ID'], 'destination': 'export', 'uploadSymbols': True}, output)
          PY
      - name: Archive and export signed app with matching widget version
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath build/App.xcarchive -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey_ci.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist App/exportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_ci.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Normalize exported IPA and record actual bundle metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          candidates = list(Path('ios/App/build/ipa').glob('*.ipa'))
          if len(candidates) != 1: raise SystemExit('Expected exactly one exported IPA')
          Path('release-candidate').mkdir()
          shutil.copyfile(candidates[0], 'release-candidate/app.ipa')
          PY
          python3 scripts/native/release_evidence.py record --metadata native-version.json --artifact release-candidate/app.ipa --platform ios --output native-artifact.json
      - name: Retain approved candidate for separate upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faithful-days-approved-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-candidate/app.ipa
            native-version.json
            native-artifact.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain sanitized source and checksum evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faithful-days-ios-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-version.json
            native-artifact.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_ci.p8"
  upload:
    needs: archive
    if: inputs.skip_upload != true && inputs.upload
    environment: testflight-upload
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require independent TestFlight upload approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py environment --environment testflight-upload
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: faithful-days-approved-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-ipa
      - name: Revalidate the exact approved IPA before upload
        run: |
          set -euo pipefail
          python3 scripts/native/release_evidence.py record --metadata approved-ipa/native-version.json --artifact approved-ipa/release-candidate/app.ipa --platform ios --output upload-native-artifact.json
          cmp approved-ipa/native-artifact.json upload-native-artifact.json
      - name: Require protected upload authentication
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in ASC_API_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing protected upload input: $name"; exit 1; }
          done
      - name: Upload approved IPA to TestFlight
        uses: apple-actions/upload-testflight-build@14df18fee5a4ff3b76971dd382f033494a0194e9 # v5.5.0
        with:
          app-path: approved-ipa/release-candidate/app.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
      - run: echo 'Upload action completed. Confirm Apple processing, TestFlight availability and physical installation; no App Review submission was requested.' >> "$GITHUB_STEP_SUMMARY"
