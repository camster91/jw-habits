name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Build number override (default: workflow run number)'
        required: false
        type: string
      marketing_version:
        description: 'Version override (default: tag or package version)'
        required: false
        type: string
      skip_upload:
        description: 'Unsigned simulator compile only'
        required: false
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION_INPUT: ${{ inputs.marketing_version }}
      BUILD_INPUT: ${{ inputs.bundle_version }}
      RUN_BUILD: ${{ github.run_number }}
      SKIP_UPLOAD: ${{ inputs.skip_upload && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm test && npm run format:check && npm run build
      - run: npx cap sync ios
      - name: Resolve matching app and widget versions
        run: |
          set -euo pipefail
          version="$VERSION_INPUT"
          if [[ -z "$version" ]]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
            fi
          fi
          build="${BUILD_INPUT:-$RUN_BUILD}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Version must be major.minor.patch'; exit 1; }
          [[ "$build" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Build must be a positive integer'; exit 1; }
          printf 'MARKETING_VERSION=%s\nCURRENT_PROJECT_VERSION=%s\n' "$version" "$build" >> "$GITHUB_ENV"
      - name: Unsigned simulator compile
        if: env.SKIP_UPLOAD == 'true'
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
          MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      - name: Prepare signing authentication
        if: env.SKIP_UPLOAD != 'true'
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in ASC_API_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID ASC_TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing repository secret: $name"; exit 1; }
          done
          umask 077
          printf '%s' "$ASC_API_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey_ci.p8"
          python3 - <<'PY'
          import os, plistlib
          with open('ios/App/App/exportOptions.plist', 'wb') as output:
              plistlib.dump({'method': 'app-store-connect', 'signingStyle': 'automatic', 'teamID': os.environ['ASC_TEAM_ID'], 'destination': 'export', 'uploadSymbols': True}, output)
          PY
      - name: Archive and export signed app with matching widget version
        if: env.SKIP_UPLOAD != 'true'
        working-directory: ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath build/App.xcarchive -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey_ci.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM="$ASC_TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist App/exportOptions.plist -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey_ci.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Locate signed IPA
        if: env.SKIP_UPLOAD != 'true'
        id: ipa
        run: |
          set -euo pipefail
          ipa="$(find "$GITHUB_WORKSPACE/ios/App/build/ipa" -name '*.ipa' -type f -print -quit)"
          [[ -n "$ipa" ]] || { echo '::error::No signed IPA was produced'; exit 1; }
          printf 'path=%s\n' "$ipa" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        if: env.SKIP_UPLOAD != 'true'
        uses: apple-actions/upload-testflight-build@14df18fee5a4ff3b76971dd382f033494a0194e9 # v5.5.0
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey_ci.p8"
      - name: Summary
        if: success()
        run: |
          if [[ "$SKIP_UPLOAD" == true ]]; then
            echo 'Unsigned simulator compilation passed; no TestFlight upload requested.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Upload accepted by the TestFlight action; confirm processing and installation in App Store Connect.' >> "$GITHUB_STEP_SUMMARY"
          fi
