name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'Unused build number (default: committed native-release.json; verify store history)'
        required: false
        type: string
      marketing_version:
        description: 'Version assertion (must match package.json and tag)'
        required: false
        type: string
      skip_upload:
        description: 'Unsigned simulator compile only; no signing or upload'
        required: false
        type: boolean
        default: false
      upload:
        description: 'Request separately approved TestFlight upload after signing'
        required: false
        type: boolean
        default: false
      signed_run_id:
        description: 'Replay a retained signed run without rebuilding (empty: normal archive)'
        required: false
        type: string
      signed_run_attempt:
        description: 'Retained signing attempt'
        required: false
        type: string
        default: '1'
      signed_source_sha:
        description: 'Full source commit of the inspected retained IPA'
        required: false
        type: string
      signed_ipa_sha256:
        description: 'Separately inspected retained IPA SHA-256'
        required: false
        type: string
permissions:
  contents: read
  actions: read
  checks: read
concurrency:
  group: ios-testflight
  cancel-in-progress: false
env:
  VERSION_INPUT: ${{ inputs.marketing_version }}
  BUILD_INPUT: ${{ inputs.bundle_version }}
  REPLAY_RUN: ${{ inputs.signed_run_id }}
  REPLAY_ATTEMPT: ${{ inputs.signed_run_attempt }}
  REPLAY_SOURCE: ${{ inputs.signed_source_sha }}
  REPLAY_SHA256: ${{ inputs.signed_ipa_sha256 }}
  REPLAY_SKIP_UPLOAD: ${{ inputs.skip_upload }}
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high && npm run lint && npm run test:coverage && npm run format:check && npm run build && npm run budgets
      - run: python3 scripts/native/test_distribution_profiles.py && python3 scripts/native/test_release_guard.py && python3 scripts/native/test_release_evidence.py && python3 scripts/native/test_keystore_generator.py && python3 scripts/native/test_signed_ipa_replay.py
      - run: python3 scripts/native/release_evidence.py resolve --output native-version.json
      - name: Require exact-source checks before signing
        if: inputs.skip_upload != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py source
      - name: Validate retained signing selection without credentials
        if: inputs.signed_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/signed_ipa_replay.py plan
  simulator:
    needs: preflight
    if: inputs.skip_upload == true && inputs.signed_run_id == ''
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: python3 scripts/native/release_evidence.py resolve --output native-version.json --github-env "$GITHUB_ENV"
      - run: npm run build && npx cap sync ios
      - name: Compile app and widget without signing
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -sdk iphonesimulator -configuration Debug
          -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
          MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
      - run: echo 'Unsigned simulator compile passed; signing, upload and device behavior remain unverified.' >> "$GITHUB_STEP_SUMMARY"
  archive:
    needs: preflight
    if: inputs.skip_upload != true && inputs.signed_run_id == ''
    environment: ios-signing
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Require solo-owner signing approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py environment --environment ios-signing
      - run: npm ci
      - run: python3 scripts/native/release_evidence.py resolve --output native-version.json --github-env "$GITHUB_ENV"
      - run: npm run build && npx cap sync ios
      - name: Prepare protected App Store distribution signing
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          IOS_WIDGET_STORE_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_STORE_PROFILE_BASE64 }}
          IOS_DISTRIBUTION_CERT_SHA256: ${{ vars.IOS_DISTRIBUTION_CERT_SHA256 }}
        run: |
          set -euo pipefail
          umask 077
          python3 scripts/native/distribution_profiles.py
          python3 - <<'PYCODE'
          import os, plistlib, secrets, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'faithful-distribution'
          password = secrets.token_urlsafe(32)
          keychain = str(root / 'distribution.keychain-db')
          def run(args):
              result = subprocess.run(args, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if result.returncode:
                  raise RuntimeError('Private distribution keychain setup failed')
          run(['security', 'create-keychain', '-p', password, keychain])
          run(['security', 'set-keychain-settings', '-lut', '21600', keychain])
          run(['security', 'unlock-keychain', '-p', password, keychain])
          run(['security', 'import', str(root / 'distribution.p12'), '-k', keychain, '-P', os.environ['IOS_DISTRIBUTION_P12_PASSWORD'], '-T', '/usr/bin/codesign'])
          run(['security', 'set-key-partition-list', '-S', 'apple-tool:,apple:,codesign:', '-s', '-k', password, keychain])
          run(['security', 'list-keychains', '-d', 'user', '-s', keychain])
          profiles = {}
          for path in root.glob('*.mobileprovision'):
              profile = plistlib.loads(subprocess.check_output(['security', 'cms', '-D', '-i', str(path)]))
              identifier = profile['Entitlements']['application-identifier'].split('.', 1)[1]
              profiles[identifier] = profile['UUID']
          with open('ios/App/App/exportOptions.plist', 'wb') as output:
              plistlib.dump({'method': 'app-store-connect', 'signingStyle': 'manual', 'teamID': 'NVJ5UY3T2X', 'destination': 'export', 'uploadSymbols': True, 'signingCertificate': 'Apple Distribution', 'provisioningProfiles': profiles}, output)
          PYCODE
      - name: Archive and export signed app with matching widget version
        working-directory: ios/App
        run: |
          set -euo pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath build/App.xcarchive -destination 'generic/platform=iOS' \
            archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=NVJ5UY3T2X \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION"
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build/ipa \
            -exportOptionsPlist App/exportOptions.plist
      - name: Normalize exported IPA and record actual bundle metadata
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          candidates = list(Path('ios/App/build/ipa').glob('*.ipa'))
          if len(candidates) != 1: raise SystemExit('Expected exactly one exported IPA')
          Path('release-candidate').mkdir()
          shutil.copyfile(candidates[0], 'release-candidate/app.ipa')
          PY
          python3 scripts/native/release_evidence.py record --metadata native-version.json --artifact release-candidate/app.ipa --platform ios --output native-artifact.json
      - name: Retain approved candidate for separate upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faithful-days-approved-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-candidate/app.ipa
            native-version.json
            native-artifact.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain sanitized source and checksum evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faithful-days-ios-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-version.json
            native-artifact.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary distribution signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/faithful-distribution/distribution.keychain-db" || true
          rm -rf "$RUNNER_TEMP/faithful-distribution"

  upload:
    needs: archive
    if: inputs.skip_upload != true && inputs.upload && inputs.signed_run_id == ''
    environment: testflight-upload
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require independent TestFlight upload approval policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py environment --environment testflight-upload
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: faithful-days-approved-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-ipa
      - name: Revalidate the exact approved IPA before upload
        run: |
          set -euo pipefail
          python3 scripts/native/release_evidence.py record --metadata approved-ipa/native-version.json --artifact approved-ipa/release-candidate/app.ipa --platform ios --output upload-native-artifact.json
          cmp approved-ipa/native-artifact.json upload-native-artifact.json
      - name: Require protected upload authentication
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in ASC_API_PRIVATE_KEY ASC_KEY_ID ASC_ISSUER_ID; do
            [[ -n "${!name}" ]] || { echo "::error::Missing protected upload input: $name"; exit 1; }
          done
      - name: Upload approved IPA to TestFlight
        uses: apple-actions/upload-testflight-build@14df18fee5a4ff3b76971dd382f033494a0194e9 # v5.5.0
        with:
          app-path: approved-ipa/release-candidate/app.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
      - run: echo 'Upload action completed. Confirm Apple processing, TestFlight availability and physical installation; no App Review submission was requested.' >> "$GITHUB_STEP_SUMMARY"

  upload_existing:
    needs: preflight
    if: inputs.signed_run_id != '' && inputs.upload && inputs.skip_upload != true
    environment: testflight-upload
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require independent owner upload approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/release_guard.py environment --environment testflight-upload
      - name: Recheck retained run after approval wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native/signed_ipa_replay.py plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.signed_run_id }}
          name: faithful-days-approved-ipa-${{ inputs.signed_run_id }}-${{ inputs.signed_run_attempt }}
          path: approved-ipa
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.signed_source_sha }}
          path: candidate-source
          persist-credentials: false
      - name: Validate exact previously inspected bytes and signed source
        run: python3 scripts/native/signed_ipa_replay.py verify
      - name: Recheck Apple identity and unused build number
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: python3 scripts/native/apple_build_guard.py
      - name: Upload exact retained IPA to TestFlight
        uses: apple-actions/upload-testflight-build@14df18fee5a4ff3b76971dd382f033494a0194e9 # v5.5.0
        with:
          app-path: approved-ipa/release-candidate/app.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
      - run: echo 'Retained IPA upload completed. Apple processing and physical installation remain separate gates.' >> "$GITHUB_STEP_SUMMARY"
