name: CI Build

# Build-only workflow: verifies the project builds cleanly, lints clean,
# and all unit tests pass. No deploy, no secrets required.
# Triggered on push to default branch and on PRs targeting it.
# Manual dispatch available.
#
# Why this exists: in June 2026, five dependabot PRs (#97–#102) merged
# without a build check. One of them (PR #100, tailwindcss 3→4) silently
# broke `npm run build`. This workflow makes that impossible going forward.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # gitleaks-action reads the PR's commit list via the API. Without this the
  # job dies with 403 "Resource not accessible by integration" before the
  # scan runs, failing the whole workflow on a permissions error rather than
  # a finding. See PR #219.
  pull-requests: read

# Dependabot PRs don't have access to repo secrets by default. Explicitly
# allow them to trigger this workflow (which uses no secrets).
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions#about-dependabot-and-github-actions

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Hard fail on high/critical advisories. The overrides block in
      # package.json pins fixed floors, but those go stale as soon as a
      # newer advisory lands (js-yaml 4.3.1 vs 4.3.2, Oct 2026). Without
      # this step nothing noticed.
      - name: Security audit
        run: npm audit --audit-level=high

      # Hard fail on lint errors. The June 2026 versions of this file
      # had `continue-on-error: true` here, which is exactly the
      # configuration that let broken dependabot PRs merge silently.
      - name: Lint
        run: npm run lint
        env:
          CI: true

      # Hard fail on test failures.
      - name: Unit tests
        run: npm test
        env:
          CI: true

      # Hard fail on build failures. This is the original reason for
      # the workflow's existence.
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          CI: true

      # Format check. Was previously a separate format.yml workflow (now
      # removed in the 2026-07-22 review follow-up because it duplicated
      # this ci.yml pipeline). Uses --check so a bad diff fails CI rather
      # than silently rewriting the working tree.
      - name: Format check
        run: npm run format:check
        env:
          CI: true

      # Secret scan. Catches committed credentials before they reach main.
      # Added 2026-07-22 after the keystore-password P0 leak review.
      # Public repo config; for private repos, switch to the GitHub App.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}